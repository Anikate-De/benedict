<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body,
      .stage {
        width: 1280px;
        height: 520px;
      }
      .stage {
        gap: 40px;
        align-items: center;
        justify-content: center;
      }
      .window {
        width: 556px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="window">
        <div class="titlebar">
          <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <div class="title">before — user@bench: ~</div>
        </div>
        <div class="body" style="min-height: 96px">
          <div class="line"><span class="green">$</span> <span class="caret"></span></div>
        </div>
      </div>

      <div class="window">
        <div class="titlebar">
          <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
          <div class="title">after — user@bench: ~</div>
        </div>
        <div class="body" style="min-height: 96px">
          <div class="line"><span class="green">$</span> the quick brown fox jumps over the lazy dog<span class="caret green"></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
