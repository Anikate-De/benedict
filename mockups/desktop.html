<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body,
      .stage {
        width: 1280px;
        height: 800px;
      }
      .stage {
        display: block;
      }
      .center .window {
        width: 720px;
      }
    </style>
  </head>
  <body>
    <div class="stage desktop">
      <div class="center">
        <div class="window">
          <div class="titlebar">
            <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
            <div class="title">user@bench: ~</div>
          </div>
          <div class="body">
            <div class="line"><span class="green">$</span> git commit -am "fix focus detection for terminals"</div>
            <div class="line muted">[main 3f9c1a] fix focus detection for terminals</div>
            <div class="line muted">&nbsp;2 files changed, 14 insertions(+), 3 deletions(-)</div>
            <div class="line"><span class="green">$</span> <span class="caret"></span></div>
          </div>
        </div>
      </div>

      <div class="pillwrap">
        <div class="pill">
          <div class="row1"><span class="led"></span> Listening<span class="mic">Built-in Audio Analog Stereo</span></div>
          <div class="row2">the quick brown fox jumps over the lazy<span class="caret green"></span></div>
        </div>
      </div>
    </div>
  </body>
</html>
