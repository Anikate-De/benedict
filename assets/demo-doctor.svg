<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-label="Terminal output of benedict doctor">
  <rect width="680" height="420" fill="#0b0b0b"/>
  <rect x="0.5" y="0.5" width="679" height="419" rx="8" fill="#0e0e0e" stroke="#262626"/>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#262626"/>
  <circle cx="18" cy="16" r="5" fill="#2e2e2e"/>
  <circle cx="36" cy="16" r="5" fill="#2e2e2e"/>
  <circle cx="54" cy="16" r="5" fill="#2e2e2e"/>
  <text x="340" y="21" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6f6f6f">benedict doctor</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <text x="24" y="66" fill="#7ee787">$ benedict doctor</text>

    <text x="40" y="98" fill="#7ee787">[ ok ]</text>
    <text x="104" y="98" fill="#c8c8c8">keyd chord</text>
    <text x="680" y="98" text-anchor="end" fill="#6f6f6f" font-size="12">f24 via layer(dictation)</text>

    <text x="40" y="126" fill="#7ee787">[ ok ]</text>
    <text x="104" y="126" fill="#c8c8c8">keyboard access</text>
    <text x="680" y="126" text-anchor="end" fill="#6f6f6f" font-size="12">evdev readable (udev ACL)</text>

    <text x="40" y="154" fill="#7ee787">[ ok ]</text>
    <text x="104" y="154" fill="#c8c8c8">Xvfb display</text>
    <text x="680" y="154" text-anchor="end" fill="#6f6f6f" font-size="12">:99 running</text>

    <text x="40" y="182" fill="#7ee787">[ ok ]</text>
    <text x="104" y="182" fill="#c8c8c8">Chrome profile</text>
    <text x="680" y="182" text-anchor="end" fill="#6f6f6f" font-size="12">~/.local/share/benedict/chrome</text>

    <text x="40" y="210" fill="#7ee787">[ ok ]</text>
    <text x="104" y="210" fill="#c8c8c8">ChatGPT session</text>
    <text x="680" y="210" text-anchor="end" fill="#6f6f6f" font-size="12">logged in</text>

    <text x="40" y="238" fill="#7ee787">[ ok ]</text>
    <text x="104" y="238" fill="#c8c8c8">ydotool</text>
    <text x="680" y="238" text-anchor="end" fill="#6f6f6f" font-size="12">$XDG_RUNTIME_DIR/.ydotool_socket</text>

    <text x="40" y="266" fill="#7ee787">[ ok ]</text>
    <text x="104" y="266" fill="#c8c8c8">clipboard</text>
    <text x="680" y="266" text-anchor="end" fill="#6f6f6f" font-size="12">wl-copy available</text>

    <text x="40" y="294" fill="#7ee787">[ ok ]</text>
    <text x="104" y="294" fill="#c8c8c8">focus tracking</text>
    <text x="680" y="294" text-anchor="end" fill="#6f6f6f" font-size="12">benedict-focus@benedict</text>

    <text x="40" y="322" fill="#7ee787">[ ok ]</text>
    <text x="104" y="322" fill="#c8c8c8">audio input</text>
    <text x="680" y="322" text-anchor="end" fill="#6f6f6f" font-size="12">Built-in Audio Analog Stereo</text>

    <text x="24" y="360" fill="#7ee787">9 checks passed</text>
    <text x="24" y="388" fill="#6f6f6f" font-size="12">$ </text>
    <rect x="40" y="377" width="8" height="14" fill="#c8c8c8"/>
  </g>
</svg>
