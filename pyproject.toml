[project]
name = "benedict"
version = "0.2.1"
description = "Push-to-talk ChatGPT dictation for Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "evdev>=1.7",
    "playwright>=1.49",
]

[project.scripts]
benedict = "benedict.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benedict"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["benedict"]

[tool.coverage.report]
show_missing = true
